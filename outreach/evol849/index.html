      <section class="background"><h3 id="plbzol-849-evolutionary-biology-spring-2015">PLB/ZOL 849 Evolutionary Biology Spring 2015</h3>
<p>Genome Evolution – April 28th and April 30th
Instructor: Jason Gallant</p>

<p>Recent advances in technology have made it possible to collect genome sequence data from a wide variety of organisms at very little cost.  Comparative genomics is an emerging new field that leverages this rapidly proliferating genomics data to address questions regarding the evolution of genomes and gene function.</p>

<h4 id="meeting1--april-28th-reading-assignments">Meeting 1- April 28th Reading Assignments:</h4>

<p> During the first lecture, we will survey the tools and methodological approaches to comparative genomics:</p>

<ul>
  <li>
    <p><em><a href="http://www.ncbi.nlm.nih.gov/books/NBK21112/"> “Chapter 15: How Genomes Evolve” in Brown TA. Genomes. 2nd edition. Oxford: Wiley-Liss; 2002.</a>   </em></p>
  </li>
  <li>
    <p><a href="http://www.sciencedirect.com/science/article/pii/S0168952514001127">_ van Dijk, Erwin L. et al. Ten years of next-generation sequencing technology. Trends in Genetics , Volume 30 , Issue 9 , 418 – 426_</a></p>
  </li>
  <li>
    <p><a href="http://www.nature.com/nrg/journal/v11/n7/full/nrg2795.html">Hawkins, R. David, Gary C. Hon, and Bing Ren. “Next-generation genomics: an integrative approach.” Nature Reviews Genetics 11.7 (2010): 476-486.</a></p>
  </li>
</ul>

<h4 id="meeting2--april-30th-reading-assignments">Meeting 2- April 30th Reading Assignments:</h4>

<p>During our second meeting, we will consider a few “case studies” in comparative genomics.  Read ALL of the following and consider the questions during your readings.  <strong>Write a one page essay on ONE of the assigned papers (determined by your name), addressing each of the questions.  Send your essay to jgallant@msu.edu by April 29th at 5:00PM.</strong></p>

<h4 id="if-your-last-name-falls-between-a-andli-you-are-assigned">If your last name falls between A and Li, you are assigned:</h4>

<ul>
  <li><a href="http://www.sciencemag.org/content/344/6191/1522.full.html">Gallant, Jason R., et al. “Genomic basis for the convergent evolution of electric organs.” <em>Science</em> 344.6191 (2014): 1522-1525.</a></li>
</ul>

<p><em>1) What is the central thesis of this paper?</em></p>

<p><em>2) Was the genome of the electric eel necessary for this study?</em></p>

<p><em>3) How were homologues between fishes identified?</em></p>

<p><em>4) More than 20,000 genes were examined in this study, yet only 30 are discussed.  Are you convinced of the importance of these genes and the central thesis of this paper?</em></p>

<h4 id="if-your-last-name-falls-between-lo-ando-you-are-assigned">If your last name falls between Lo and O you are assigned:</h4>

<ul>
  <li><a href="http://www.pnas.org/content/107/51/22172.long">Arnegard, Matthew E., et al. “Old gene duplication facilitates origin and diversification of an innovative communication system—twice.” <em>Proceedings of the National Academy of Sciences</em> 107.51 (2010): 22172-22177.</a></li>
</ul>

<p><em>1) What are the predictions that Scn4aa directly contributes to the parallel evolution of myogenic electric organs?  Would you add any additional predictions?</em></p>

<p><em>2) What are the functional consequences of positive selection on Scn4aa in electric fish?</em></p>

<p><em>3) Do the authors make a compelling case that Scn4aa directly contributed to the parallel evolution of myogenic electric organs?</em></p>

<p><em>4) Do you think it is merely coincidence that electric fish have used Scn4aa repeatedly?  Can you design a comparative genomics experiment that might address this question?</em></p>

<h4 id="if-your-last-name-name-falls-between-p-zyou-are-assigned-gallant-et-al-ancient-homology">If your last name name falls between P-Z you are assigned Gallant et al. “Ancient Homology…”</h4>

<ul>
  <li><a href="http://www.nature.com/ncomms/2014/140908/ncomms5817/full/ncomms5817.html">Gallant, Jason R., et al. “Ancient homology underlies adaptive mimetic diversity across butterflies.” <em>Nature communications</em> 5 (2014).</a></li>
</ul>

<p><em>1) What is the hypothesized “cause” of mimetic wing patterning in Limenitis butterflies?  What about in Heliconius butterflies?  Why is this considered an example of “ancient homology”?</em></p>

<p><em>2) RNA-seq is used in a different way than in study on convergent electric organ evolution.  What did the authors find and how does it relate to the findings of the hypothesized “cause” of mimetic wing patterning?</em></p>

<p><em>3) The quotation referenced in the beginning of this article is below:</em></p>

<blockquote>_The animal world is full of convergences …If there is only one efficient solution for a certain functional demand, very different gene complexes will come up with the same solution, no matter how different the pathway by which it is achieved.  **The saying “many roads lead to rome” is as true in evolution as it is in daily affairs.**-Ernst Mayr Animal Species and Evolution_</blockquote>

<p><em>The authors of this article seem to demonstrate that fewer roads lead to rome than previously thought, at least for butterflies.  What factors might contribute to the same vs. different biochemical pathways underlying the convergent evolution of phenotypic traits?</em></p>

<h4 id="optional-readings">OPTIONAL Readings:</h4>

<p>Below follows a list of readings on topics discussed here for students that may be considering genomics as part of their thesis work, or are eager to go more in depth on some of these topics then the assigned readings go:</p>

<p>Sequencing Assembly:</p>

<ul>
  <li>
    <p>_ Nagarajan, Niranjan, and Mihai Pop. “Sequence assembly demystified.” Nature Reviews Genetics 14.3 (2013): 157-167._</p>
  </li>
  <li>
    <p>_ Wheeler, David, and Medha Bhagwat. “BLAST QuickStart.” (2007). <em>_http://www.ncbi.nlm.nih.gov/books/NBK1734/</em></p>
  </li>
  <li>
    <p><em>Compeau, Phillip EC, Pavel A. Pevzner, and Glenn Tesler. “How to apply de Bruijn graphs to genome assembly.” Nature biotechnology 29.11 (2011): 987-991.</em></p>
  </li>
  <li>
    <p><em>Martin, Jeffrey A., and Zhong Wang. “Next-generation transcriptome assembly.” Nature Reviews Genetics 12.10 (2011): 671-682.</em></p>
  </li>
</ul>

<p>Comparative Genomics:</p>

<ul>
  <li>
    <p><em>Roux, Julien, Marta Rosikiewicz, and Marc Robinson-Rechavi. “What to compare and how: comparative transcriptomics for Evo-Devo.” bioRxiv (2014): 011213.</em></p>
  </li>
  <li>
    <p>_ Hardison RC (2003) Comparative Genomics. PLoS Biol 1(2): e58. doi:10.1371/journal.pbio.0000058_</p>
  </li>
  <li>
    <p>_ Miller, Webb, et al. “Comparative genomics.” Annu. Rev. Genomics Hum. Genet. 5 (2004): 15-56._</p>
  </li>
</ul>

<p>Methodological Approaches to Comparative Genomics:</p>

<ul>
  <li>
    <p><em>Allen, Eric E., and Jillian F. Banfield. “Community genomics in microbial ecology and evolution.” Nature Reviews Microbiology 3.6 (2005): 489-498.</em></p>
  </li>
  <li>
    <p><em>Luikart, Gordon, et al. “The power and promise of population genomics: from genotyping to genome typing.” Nature Reviews Genetics 4.12 (2003): 981-994.</em></p>
  </li>
</ul>
