<h1 id="outreach">
<i class="fas fa-tools"></i>Outreach</h1>

<blockquote class="twitter-tweet">
<p lang="en" dir="ltr">Here's a closeup of our outreach rig. <a href="https://twitter.com/hashtag/eastlansingsciencenights?src=hash&ref_src=twsrc%5Etfw">#eastlansingsciencenights</a> <a href="https://t.co/VIEr5xfhcL">pic.twitter.com/VIEr5xfhcL</a></p>— jasongallant (@jasongallant) <a href="https://twitter.com/jasongallant/status/797959275310002177?ref_src=twsrc%5Etfw">November 14, 2016</a>
</blockquote>
<script async="" src="https://platform.twitter.com/widgets.js" charset="utf-8"></script>

<p>Public outreach is a huge component of our work!  You will find many members of the laboratory working out in Michigan and around the country, educating children and adults alike about our research!  We’ve built a number of devices that highlight the unique abilities of electric fish using multiple senses, including light.  Of course, one example of this is our favorite holiday classic on campus, the <a href="/2014/12/12/electric-fish-christmas-tree/">Electric Fish Christmas Tree</a>, which you can behold from the comfort of your own home, or even build yourself!  If you’re feeling particularly festive, come visit it in the basement of Natural Sciences where it is displayed every year from Thanksgiving to New Year’s!</p>

<blockquote class="twitter-tweet">
<p lang="en" dir="ltr">Our awesome grad students teaching K-12 teachers how to incorporate efish in their lessons <a href="https://twitter.com/KelloggBioStn?ref_src=twsrc%5Etfw">@KelloggBioStn</a> <a href="https://twitter.com/NSF_BIO?ref_src=twsrc%5Etfw">@NSF_BIO</a> <a href="https://twitter.com/1968CR?ref_src=twsrc%5Etfw">@1968CR</a> <a href="https://t.co/XCehJAacr6">pic.twitter.com/XCehJAacr6</a></p>— jasongallant (@jasongallant) <a href="https://twitter.com/jasongallant/status/855249477782908928?ref_src=twsrc%5Etfw">April 21, 2017</a>
</blockquote>
<script async="" src="https://platform.twitter.com/widgets.js" charset="utf-8"></script>

<p>Several members of the lab are also active in training teachers on using electric fish in their classrooms, through participation in the Kellogg Biological Stations’ <a href="http://kbsgk12project.kbs.msu.edu">GK-12 Program</a>.  Shown here are <a href="/people/mau/">Mau</a> and <a href="/people/savvas/">Savvas</a> lecturing during one of these recent training sessions.  In the coming months, watch this space as we will be developing new materials for teachers and sharing them on this website!  While there is certainly a strong biological component to our work, our curriculum modules can be well integrated into middle-school physics classrooms as a way to discuss “forms of energy”.  Did you know that electric fishes inspired the design of the voltaic pile?</p>

<blockquote class="twitter-tweet">
<p lang="en" dir="ltr">Kat lead a great outreach effort today, including "pin the elctrocyte on the fish" <a href="https://twitter.com/michiganstateu?ref_src=twsrc%5Etfw">@michiganstateu</a> scifest <a href="https://twitter.com/NSF_BIO?ref_src=twsrc%5Etfw">@NSF_BIO</a> <a href="https://t.co/aRZk5hgYSa">pic.twitter.com/aRZk5hgYSa</a></p>— jasongallant (@jasongallant) <a href="https://twitter.com/jasongallant/status/855973921535012865?ref_src=twsrc%5Etfw">April 23, 2017</a>
</blockquote>
<script async="" src="https://platform.twitter.com/widgets.js" charset="utf-8"></script>

<p>Of course, learning about Electric Fish can be fun and games!  We’ve come up with some clever ways of getting students to think about anatomy and physiology, too.  An example of this was the development of a fun game designed by <a href="/people/kat">Kat</a>:  “Pin the electrocyte on the electric fish!”  We’ve been getting calls from Milton-Bradley (We kid..)  The kids that visited us at <a href="http://sciencefestival.msu.edu">MSU’s Science Festival</a> sure dug it though!  In 2016, we participated in Science Night: East Lansing throughout the month of November, and met hundreds of kids and their parents, and of course introduced them to the wonders of electric fish.  We’ll undoubtedly be taking our road show into elementary schools again this fall, so stay tuned!</p>
