<p><strong>Guidelines:</strong></p>

<ul>
  <li>
    <p>Papers will be sent at least a week in advance by presenter to list serve</p>
  </li>
  <li>
    <p>Presenters should select an “introductory” reading on the topic, and then something more advanced/cutting edge/applied (when possible)</p>
  </li>
  <li>
    <p>Presenters must keep the presentations inside 1 hour (room constriants), encouraging discussion and questions is <strong>strongly preferred</strong>.</p>
  </li>
  <li>
    <p>Respondents listed (students taking RG for credit) will write blog post on efish.zoology.msu.edu/msu_ngs_methods to summarize and discuss the presentation (1000-1500 words), link readings, and illustrate with graphics.</p>
  </li>
  <li>
    <p>Students taking RG for credit are additionally required to edit, revise and add to 2-3 of these posts through the semester</p>
  </li>
